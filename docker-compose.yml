services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: mentoring-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: mentoring
      RABBITMQ_DEFAULT_PASS: mentoring-password

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mentoring-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mentoring-sqlserver
    hostname: sqlserver
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - mentoring-network

  catalog-api:
    image: mentoring/catalog-api:local
    container_name: mentoring-catalog-api
    restart: unless-stopped
    init: true
    build:
      context: .
      dockerfile: CatalogService.Api/Dockerfile
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"

      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: mentoring
      RabbitMq__Password: mentoring-password
      RabbitMq__VirtualHost: "/"

      ConnectionStrings__CatalogDb: "Server=sqlserver,1433;Database=CatalogServiceDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True"
    depends_on:
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mentoring-network

  cart-api:
    image: mentoring/cart-api:local
    container_name: mentoring-cart-api
    restart: unless-stopped
    init: true
    build:
      context: .
      dockerfile: CartService.API/Dockerfile
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"

      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: mentoring
      RabbitMq__Password: mentoring-password
      RabbitMq__VirtualHost: "/"

      ConnectionStrings__CartDatabase: "Filename=/app/data/cart.db;Connection=shared"
    volumes:
      - cart-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mentoring-network

volumes:
  rabbitmq-data:
  sqlserver-data:
  cart-data:

networks:
  mentoring-network:
    driver: bridge
